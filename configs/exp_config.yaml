# Frozen Experimental Protocol (assignment Gates G2 / G3)
project: "Context-Window Degradation and Its Impact on Long-Document Research Synthesis"
student_id: "PSE2026002"
seed: 42

hardware:
  platform: "Google Colab"
  target_gpu: "NVIDIA Tesla T4"
  precision: "float16"

models:
  generator_llm: "Qwen/Qwen2.5-3B-Instruct"
  dense_retriever: "BAAI/bge-small-en-v1.5"
  nli_verifier: "cross-encoder/nli-deberta-v3-small"

decoding:
  do_sample: false
  max_new_tokens: 300

dataset:
  source: "qiaojin/PubMedQA (pqa_labeled)"
  pilot_clusters: 5
  full_clusters: 15
  corpus_sizes_k: [5, 15, 25]
  target_positions: ["start", "middle", "end"]

systems_compared:
  - "Baseline_1_FullContext"
  - "Baseline_2_DenseRAG"
  - "Proposed_Fig2_Verified"

metrics:
  - "headline_recall_pct"
  - "h1_qualifier_recall_pct"
  - "h4_contradiction_pct"
  - "h3_nli_faithfulness_pct"
  - "latency_sec"
